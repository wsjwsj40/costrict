<title>DiCode · VS Code 交互原型</title>
<style>
* { box-sizing: border-box; }
html,body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  font: 13px/1.52 "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --mono: "Cascadia Code", Consolas, monospace;
  --editor: #1f1f1f; --chrome: #181818; --pane: #181818; --tool: #181818;
  --surface: #202020; --raised: #252526; --hover: #2a2d2e;
  --border: #2b2b2b; --outline: #424242;
  --text: #d4d4d4; --strong: #f0f0f0; --muted: #a5a5a5; --dim: #858585;
  --accent: #6cb6ff; --native: #0078d4; --primary: #006fbe; --on-primary: #fff;
  --select: #073656; --wash: #173149; --green: #79c88b; --red: #f48787; --yellow: #e8b660; --warm: #3d2f21;
  --kw: #c586c0; --str: #ce9178; --fn: #dcdcaa; --comment: #7ca668; --code: #d4d4d4;
  color: var(--text); background: var(--editor);
}
body.light {
  --editor: #fff; --chrome: #f8f8f8; --pane: #f8f8f8; --tool: #f8f8f8;
  --surface: #fff; --raised: #fff; --hover: #edf1f5;
  --border: #e5e5e5; --outline: #cbd2da;
  --text: #292929; --strong: #171717; --muted: #585858; --dim: #686868;
  --accent: #005fb8; --native: #005fb8; --primary: #005fb8;
  --select: #dceeff; --wash: #eaf4ff; --green: #157139; --red: #b4232b; --yellow: #925400; --warm: #fff5e3;
  --kw: #8626a4; --str: #a31515; --fn: #795e26; --comment: #008000; --code: #242424;
}
body.jb {
  --mono: "JetBrains Mono", Consolas, monospace;
  --editor: #1e1f22; --chrome: #2b2d30; --pane: #242629; --tool: #2b2d30;
  --surface: #25272a; --raised: #2b2d30; --hover: #34363a;
  --border: #383a40; --outline: #4c5058;
  --text: #d0d3da; --strong: #f0f1f4; --muted: #a6aab4; --dim: #8a8f9a;
  --accent: #7aaaff; --native: #548af7; --primary: #3168d5;
  --select: #253b62; --wash: #27364d; --green: #85c88a; --red: #f28b88; --yellow: #e9b768; --warm: #423729;
  --kw: #cf8e6d; --str: #6aab73; --fn: #56a8f5; --comment: #8b909a; --code: #bcbec4;
}
body.jb.light {
  --editor: #fff; --chrome: #f2f3f5; --pane: #f7f8fa; --tool: #f2f3f5;
  --surface: #fff; --raised: #fff; --hover: #ebeef3;
  --border: #dfe1e5; --outline: #c9ccd6;
  --text: #383a42; --strong: #24252a; --muted: #5a5d68; --dim: #686c78;
  --accent: #2358bf; --native: #3574f0; --primary: #2d61c9;
  --select: #dce9ff; --wash: #eaf1ff; --green: #22733a; --red: #ad2833; --yellow: #925400; --warm: #fff5e3;
  --kw: #0033b3; --str: #067d17; --fn: #00627a; --comment: #6a737d; --code: #26282e;
}
.icon { display: inline-block; width: 17px; height: 17px; vertical-align: middle; flex: 0 0 auto; }
.sprite { position: absolute; width: 0; height: 0; }
button { color: inherit; font: inherit; background: transparent; border: 0; padding: 0; }
button .icon { pointer-events: none; }
strong { color: var(--strong); font-weight: 620; }
small { font-size: 11px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shell { display: grid; grid-template-rows: 37px minmax(0,1fr) 23px; height: 100vh; }
.jb .shell { grid-template-rows: 42px minmax(0,1fr) 24px; }
.titlebar { display: flex; align-items: center; gap: 14px; background: var(--chrome); border-bottom: 1px solid var(--border); padding: 0 12px; color: var(--text); white-space: nowrap; font-size: 12px; }
.titlebar .icon { width: 16px; height: 16px; }
.vs-logo { color: #188bd3; width: 20px; height: 20px; }
.native-menu { display: flex; align-items: center; gap: 12px; }
.command-zone { display: flex; justify-content: center; align-items: center; gap: 12px; flex: 1; margin-right: 24px; color: var(--muted); }
.command { width: 368px; height: 26px; display: flex; justify-content: center; align-items: center; gap: 7px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); }
.command .icon { width: 14px; }
.winctrl { display: flex; align-items: center; gap: 23px; margin-left: 11px; }
.winctrl .icon { width: 13px; height: 13px; }
.jb .titlebar { gap: 12px; }
.tile { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: #31506e; color: #fff; font-size: 11px; }
.jb.light .tile { background: #b4d1f1; color: #1f3e60; }
.runbar { border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; }
.play { color: var(--green); }
.main { display: grid; grid-template-columns: 47px minmax(0,1fr); min-height: 0; position: relative; }
.jb .main { grid-template-columns: 41px minmax(0,1fr) 40px; }
.native-rail, .product-rail, .rightstripe { display: flex; flex-direction: column; align-items: center; background: var(--tool); border-right: 1px solid var(--border); padding: 6px 0; }
.native-rail button, .rightstripe button { width: 44px; height: 43px; color: var(--dim); position: relative; display: grid; place-items: center; }
.native-rail .icon, .rightstripe .icon { width: 21px; height: 21px; }
.native-rail button.selected { color: var(--strong); }
.vs .native-rail button.selected::before { content: ""; position: absolute; left: -1px; top: 1px; bottom: 1px; width: 2px; background: var(--native); }
.jb .native-rail button, .jb .rightstripe button { width: 33px; height: 33px; border-radius: 6px; margin: 1px 0; }
.jb .native-rail button.selected { background: var(--select); color: var(--accent); }
.jb .native-rail .icon, .jb .rightstripe .icon { width: 17px; height: 17px; }
.rightstripe { border-left: 1px solid var(--border); border-right: 0; }
.work { min-height: 0; display: grid; grid-template-columns: 468px minmax(0,1fr); min-width: 0; }
.work.max { grid-template-columns: minmax(0,1fr); }
.plugin { min-width: 0; min-height: 0; background: var(--pane); display: grid; grid-template-columns: 42px minmax(0,1fr); border-right: 1px solid var(--border); }
.plugin.max { grid-template-columns: 46px 322px minmax(0,1fr); border-right: 0; }
.product-rail { background: var(--pane); padding: 9px 0; gap: 6px; }
.product-rail button { width: 32px; height: 33px; border-radius: 7px; color: var(--muted); position: relative; }
.product-rail button.selected { background: var(--select); color: var(--accent); }
.product-rail .notice-number { background: var(--yellow); color: var(--pane); min-width: 13px; height: 13px; padding: 0 2px; border-radius: 7px; position: absolute; right: 0; top: 0; font: 700 9px/13px "Segoe UI"; }
.product-rail .divider { border-bottom: 1px solid var(--border); width: 22px; }
.product-rail .settings { margin-bottom: 2px; }
.panel, .history { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.panel-head, .history-head { height: 49px; flex: 0 0 49px; padding: 0 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
.brand { width: 27px; height: 27px; display: grid; place-items: center; color: #fff; border-radius: 7px; background: linear-gradient(145deg,#087bb2,#235cbb); }
.brand .icon { width: 17px; }
.panel-head h1, .history-head h2 { margin: 0; color: var(--strong); font-size: 14px; line-height: 1.15; font-weight: 650; }
.panel-head .subtitle { margin-left: 4px; color: var(--muted); font-size: 11px; }
.iconbtn { color: var(--muted); width: 27px; height: 27px; display: inline-grid; place-items: center; border-radius: 5px; }
.iconbtn .icon { width: 15px; height: 15px; }
.iconbtn.active { background: var(--select); color: var(--accent); }
.new-btn { border: 1px solid var(--outline); background: var(--surface); display: inline-flex; align-items: center; border-radius: 6px; padding: 4px 7px; gap: 5px; font-size: 11px; }
.new-btn .icon { width: 14px; height: 14px; }
.panel-scroll { flex: 1; min-height: 0; overflow: hidden; }
.chat, .composer-wrap { max-width: 795px; width: 100%; margin: 0 auto; }
.chat { padding: 17px 15px; }
.chat-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; color: var(--muted); font-size: 11px; }
.chat-head strong { font-size: 13px; }
.user-msg { background: var(--wash); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; margin-left: 22px; }
.assistant-mark { color: var(--accent); display: flex; align-items: center; gap: 7px; margin: 16px 0 7px; font-weight: 650; }
.assistant-mark .icon { width: 15px; height: 15px; }
.assistant-copy { color: var(--text); margin: 0 0 13px; line-height: 1.65; }
.process { border: 1px solid var(--outline); background: var(--surface); border-radius: 8px; overflow: hidden; }
.process-head, .step { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.process-head { border-bottom: 1px solid var(--border); background: var(--raised); }
.process-head .icon, .step .icon { width: 14px; height: 14px; }
.step + .step { border-top: 1px solid var(--border); }
.step small { margin-left: auto; white-space: nowrap; color: var(--muted); }
.step .chev { color: var(--dim); }
.step .done { color: var(--green); }
.step .running { color: var(--accent); }
.step .queued { color: var(--dim); }
.run-summary { margin-top: 10px; color: var(--muted); font-size: 11px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.badge .icon { width: 13px; height: 13px; }
.badge.done { color: var(--green); } .badge.running { color: var(--accent); } .badge.waiting { color: var(--yellow); } .badge.failed { color: var(--red); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.composer-wrap { padding: 8px 12px 10px; }
.composer { border: 1px solid var(--outline); border-radius: 10px; background: var(--surface); box-shadow: 0 3px 12px #00000014; }
.composer.focused { border-color: var(--native); }
.composer-text { min-height: 54px; padding: 10px 11px 5px; }
.composer-text.empty { color: var(--dim); }
.composer-tools { display: flex; align-items: center; gap: 4px; padding: 5px 6px 7px; position: relative; }
.composer-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 4px 5px; white-space: nowrap; border-radius: 5px; font-size: 11px; min-height: 27px; }
.composer-btn .icon { width: 13px; height: 13px; }
.composer-btn .down { width: 9px; height: 9px; }
.composer-btn.selected { color: var(--accent); background: var(--wash); }
.composer-btn.mode { color: var(--text); }
.composer-btn.usage { margin-left: auto; }
.meter { width: 13px; height: 13px; border-radius: 50%; background: conic-gradient(var(--accent) 29%, var(--outline) 0); position: relative; }
.meter::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--surface); }
.send { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--on-primary); background: var(--primary); margin-left: 2px; }
.send .icon { width: 15px; height: 15px; }
.layout-footer { border-top: 1px solid var(--border); height: 33px; display: flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 11px; color: var(--muted); }
.layout-footer .iconbtn { width: 25px; height: 24px; }
.layout-footer .iconbtn .icon { width: 14px; height: 14px; }
.workspace { display: grid; grid-template-rows: 36px 26px minmax(0,1fr) 157px; background: var(--editor); min-width: 0; min-height: 0; position: relative; }
.jb .workspace { grid-template-rows: 37px 24px minmax(0,1fr) 157px; }
.editor-tabs { display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--border); }
.file-tab { padding: 0 11px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--border); }
.file-tab.active { background: var(--editor); color: var(--strong); box-shadow: inset 0 1px var(--native); }
.file-tab .icon { width: 13px; height: 13px; }
.jb .file-tab { border: 0; margin: 4px 0 0 4px; border-radius: 5px 5px 0 0; }
.jb .file-tab.active { box-shadow: inset 0 -2px var(--native); background: var(--hover); }
.filetype { font: 700 10px/1 var(--mono); color: var(--accent); }
.breadcrumb { padding: 4px 13px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.breadcrumb .icon { width: 11px; height: 11px; }
.code-area { min-height: 0; overflow: hidden; position: relative; padding: 6px 12px 0 0; font: 13px/1.53 var(--mono); color: var(--code); }
.code-line { display: flex; padding-right: 42px; white-space: pre; }
.code-line.highlight { background: var(--surface); }
.code-line.diff { border-left: 2px solid var(--green); }
.code-line code { font: inherit; }
.ln { width: 54px; text-align: right; padding-right: 15px; color: var(--dim); user-select: none; }
.diff .ln { width: 52px; }
.code-area .kw { color: var(--kw); } .code-area .str { color: var(--str); } .code-area .fn { color: var(--fn); } .code-area .comment { color: var(--comment); }
.minimap { width: 59px; position: absolute; right: 14px; top: 6px; opacity: .7; display: grid; gap: 2px; }
.minimap i { height: 2px; display: block; background: var(--muted); opacity: .54; }
.minimap i:nth-child(3n) { background: var(--str); }
.scroll-rail { width: 10px; height: 100%; position: absolute; right: 0; top: 0; border-left: 1px solid var(--border); }
.scroll-thumb { height: 112px; position: absolute; left: 1px; right: 1px; top: 21px; background: var(--outline); opacity: .7; }
.term { border-top: 1px solid var(--border); background: var(--editor); overflow: hidden; }
.jb .term { background: var(--tool); }
.term-head { height: 36px; display: flex; gap: 17px; align-items: stretch; padding: 0 11px; color: var(--muted); font-size: 11px; }
.term-head span { display: inline-flex; align-items: center; }
.term-head .active { color: var(--strong); border-bottom: 1px solid var(--native); }
.term-head .icon { width: 14px; }
.term-copy { font: 12px/1.65 var(--mono); padding: 8px 14px; white-space: pre; color: var(--text); }
.term-copy .pass { color: var(--green); }
.status { display: flex; align-items: center; padding: 0 10px; gap: 12px; color: var(--muted); background: var(--chrome); border-top: 1px solid var(--border); white-space: nowrap; font-size: 11px; }
.status .icon { width: 13px; height: 13px; }
.status .remote { display: grid; place-items: center; background: var(--native); color: white; width: 32px; align-self: stretch; margin-left: -10px; }
.history { background: var(--tool); border-right: 1px solid var(--border); }
.history-head .icon { color: var(--accent); }
.history-body { padding: 12px; }
.search-box { display: flex; align-items: center; gap: 7px; color: var(--muted); background: var(--surface); border: 1px solid var(--outline); padding: 6px 9px; border-radius: 6px; }
.search-box .icon { width: 15px; height: 15px; }
.list-heading { display: flex; align-items: center; justify-content: space-between; margin: 14px 1px 8px; font-size: 11px; color: var(--muted); }
.session { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 5px; padding: 9px 8px; border-radius: 7px; margin-bottom: 4px; }
.session.selected { background: var(--select); }
.session strong { display: block; font-size: 12px; }
.session small { display: block; color: var(--muted); margin-top: 3px; }
.workspace-count { display: flex; justify-content: space-between; gap: 4px; margin: auto 12px 12px; padding: 9px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.list-page { padding: 15px; }
.list-page h2 { margin: 0 0 4px; font-size: 18px; color: var(--strong); }
.list-page .intro { margin: 0 0 13px; color: var(--muted); }
.segment { display: flex; align-items: center; gap: 6px; margin: 12px 0 10px; }
.segment span { border-radius: 5px; padding: 3px 7px; font-size: 11px; color: var(--muted); }
.segment .selected { background: var(--select); color: var(--accent); }
.activity-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 9px 10px; }
.activity-card.unread { border-color: var(--outline); }
.activity-card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.activity-card .link { color: var(--accent); font-size: 11px; margin-top: 5px; display: inline-block; }
.toast { width: 347px; position: absolute; bottom: 13px; right: 15px; background: var(--raised); border: 1px solid var(--outline); box-shadow: 0 6px 24px #0003; border-radius: 7px; padding: 10px 11px; }
.toast .row > .icon { color: var(--yellow); } .toast .primary .icon { width: 13px; height: 13px; }
.toast p { margin: 5px 0 8px; color: var(--muted); font-size: 12px; }
.primary { border-radius: 5px; color: #fff; background: var(--primary); padding: 5px 9px; font-size: 12px; }
.secondary { border: 1px solid var(--outline); border-radius: 5px; color: var(--text); background: var(--surface); padding: 5px 9px; font-size: 12px; }
.popover { position: absolute; bottom: 85px; z-index: 3; width: 244px; background: var(--raised); border: 1px solid var(--outline); border-radius: 8px; box-shadow: 0 8px 24px #0003; padding: 7px; }
.popover.effort { left: 111px; }
.popover.approval { left: 169px; }
.popover .label { padding: 3px 6px 5px; font-size: 11px; color: var(--muted); }
.popover-option { display: flex; align-items: flex-start; gap: 7px; padding: 7px 6px; border-radius: 5px; }
.popover-option.active { background: var(--select); }
.popover-option .icon { width: 14px; height: 14px; margin-top: 2px; color: var(--accent); }
.popover-option .detail { color: var(--muted); font-size: 11px; }
.backdrop { position: absolute; inset: 0; z-index: 6; background: #0008; display: grid; place-items: center; }
.dialog { width: 418px; background: var(--raised); color: var(--text); padding: 18px; border-radius: 11px; border: 1px solid var(--outline); box-shadow: 0 18px 48px #0006; }
.dialog h2 { margin: 0 0 9px; font-size: 17px; color: var(--strong); }
.dialog h2 .icon { color: var(--yellow); margin-right: 4px; }
.dialog p { margin: 7px 0; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 15px; }
.dialog .danger { background: #bb7d36; color: #1e130a; font-weight: 650; }
.skill-row { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 8px; padding: 10px 9px; align-items: center; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); margin-bottom: 8px; }
.skill-icon { width: 29px; height: 29px; border-radius: 6px; display: grid; place-items: center; background: var(--wash); color: var(--accent); }
.skill-row small { display: block; margin-top: 2px; color: var(--muted); }
.skill-row p { margin: 4px 0 0; font-size: 11px; }
.settings-note { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 7px; background: var(--wash); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }


[hidden] { display: none !important; }
button[data-act], button[type="submit"]:not(:disabled), summary { cursor: pointer; }
button[data-act]:disabled, button[type="submit"]:disabled { cursor: default; opacity: .55; }
button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button[data-act]:hover:not(:disabled) { filter: brightness(1.12); }
button[data-act].session:hover, .popover-option:hover, .product-rail button[data-act]:hover { background: var(--hover); }
button[data-act].session.selected:hover, .product-rail button.selected:hover { background: var(--select); }
.work { grid-template-columns: clamp(408px, 34%, 550px) minmax(0,1fr); }
.work.max { grid-template-columns: minmax(0,1fr); }
.panel-scroll, .history-body { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--outline) transparent; }
.history-body { min-height: 0; }
.history-head, .layout-footer, .workspace-count { flex-shrink: 0; }
#session-rows { display: grid; }
.session { width: 100%; text-align: left; }
.session strong { overflow: hidden; text-overflow: ellipsis; }
.history-page .history-body { padding: 0; }
.search-box input { width: 100%; min-width: 0; color: var(--strong); border: 0; background: none; font: inherit; }
.search-box input::placeholder { color: var(--dim); }
.search-box:focus-within { outline: 1px solid var(--accent); }
.search-box input:focus-visible { outline: 0; }
.turn + .turn { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 19px; }
.turn:focus, .decision-card:focus { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.turn .assistant-mark small { font-weight: 400; }
.user-msg { white-space: pre-wrap; overflow-wrap: anywhere; }
.attachment-ref { margin-top: 5px; white-space: normal; font-size: 11px; }
.attachment-ref .icon, .result-files .icon, .attached .icon { width: 13px; height: 13px; }
.result-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.result-files button { font-family: var(--mono); font-size: 10px; }
.stage { border-top: 1px solid var(--border); }
.process-head + .stage { border-top: 0; }
.stage summary { list-style: none; }
.stage summary::-webkit-details-marker { display: none; }
.stage[open] > summary .chev { transform: rotate(90deg); }
.stage summary:hover { background: var(--hover); }

function highlight(line) {
  if (line.trimStart().startsWith('//')) return `<span class="comment">${esc(line)}</span>`;

  let result = '';
  let start = 0;
  for (const match of line.matchAll(pattern)) {
    result += esc(line.slice(start, match.index));
    const cls = match[0].startsWith("'") ? 'str' : match[1] ? 'kw' : 'fn';
    result += `<span class="${cls}">${esc(match[0])}</span>`;
    start = match.index + match[0].length;
  }
  return result + esc(line.slice(start));

      <div class="segment">${[['all','全部'],['waiting',`待处理 ${pendingCount()}`],['running',`运行中 ${activeCount()}`],['ended','已结束']].map(([id,name]) => `<button type="button" class="${state.noticeFilter === id ? 'selected' : ''}" data-act="notice-filter" data-value="${id}">${name}</button>`).join('')}</div>
      ${rows.map(([session,run]) => `<article class="activity-card ${run.status === 'waiting' ? 'unread' : ''}"><div class="row"><strong>${esc(session.title)}</strong>${grow}${runStatus(run.status)}</div>
      <p>${notes[run.status]} · ${timeText(session.changed)}</p><button type="button" class="link" data-act="jump" data-value="${session.id}" data-id="${run.id}">${run.status === 'waiting' ? '返回对话处理' : '打开对应对话'} ›</button></article>`).join('') || '<p class="muted">当前没有符合条件的消息。</p>'}
    </div>`;
  }
  function marketRows() {
    const q = state.marketQuery.toLowerCase().trim();
    return catalog.filter(([id,,title,scope]) => (state.marketFilter === 'all' || installed.has(id)) && `${title} ${scope} DiCode 官方`.toLowerCase().includes(q)).map(([id,icon,title,scope]) => {
      const status = installed.has(id) ? 'installed' : state.installStates[id] || 'ready';
      const labels = { installed:'已安装', installing:'安装中…', failed:'重试', ready:'一键安装' };
      return `<article class="skill-row"><div class="skill-icon">${glyph(icon)}</div><div><strong>${title}</strong><small>DiCode 官方 · ${scope}</small>${status === 'failed' ? '<p class="failed">上次安装超时</p>' : ''}</div>
        <button type="button" class="${status === 'ready' ? 'primary' : 'secondary'}" data-act="install" data-value="${id}" aria-label="${labels[status]} ${title}" ${['installed','installing'].includes(status) ? 'disabled' : ''}>${status === 'installing' ? glyph('spinner','spinning') : status === 'installed' ? glyph('check') : ''} ${labels[status]}</button></article>`;
    }).join('') || '<p class="muted">没有符合条件的 Skill。</p>';
  }
  function market() {
    return `<div class="list-page"><h2>Skill 市场</h2><p class="intro">安装后可用于下一次任务。</p>
      <label class="search-box">${glyph('search')}<input type="search" id="market-query" aria-label="搜索 Skill" placeholder="搜索 Skill、发布者或能力" value="${esc(state.marketQuery)}"></label>
      <div class="segment">${[['all','全部'],['installed','已安装']].map(([id,name]) => `<button type="button" class="${state.marketFilter === id ? 'selected' : ''}" data-act="market-filter" data-value="${id}">${name}</button>`).join('')}</div>
      <div id="skill-rows">${marketRows()}</div><p class="intro">此市场使用演示数据，安装只记录本地状态。</p>
    </div>`;
  }
  function install(id) {
    if (installed.has(id) || state.installStates[id] === 'installing' || !catalog.some(([key]) => key === id)) return;
    const fail = id === 'docs' && !state.installStates[id];
    state.installStates[id] = 'installing';
    render();
    setTimeout(() => {
      if (fail) state.installStates[id] = 'failed';
      else {
        delete state.installStates[id];
        installed.add(id);
        persist();
      }
      render();
    },950);
  }
  function workspace() {
    const name = state.file;
    const lines = codeSamples[name];
    const tabs = ['TaskBoard.tsx','useTaskStream.ts','TaskBoard.test.tsx'];
    if (!tabs.includes(name)) tabs.push(name);
    const crumb = jb ? `${glyph('file')} ${name.replace(/\.(tsx|ts)$/,'')}${grow}<span class="row pass">${glyph('check')} No problems</span>` :
      `${filePaths[name].split('/').map((part) => esc(part)).join(` ${glyph('chevron')} `)}`;
    const terminalTabs = jb ? '<span class="active">Terminal</span><span>Local</span>' :
      '<span>PROBLEMS</span><span>OUTPUT</span><span>DEBUG CONSOLE</span><span class="active">TERMINAL</span><span>PORTS</span>';
    return `<div class="editor-tabs" aria-label="文件标签">${tabs.map((file) => `<button type="button" class="file-tab ${name === file ? 'active' : ''}" data-act="file" data-value="${file}" aria-current="${name === file}"><span class="filetype">${file.endsWith('tsx') ? 'TSX' : 'TS'}</span>${file}</button>`).join('')}${grow}<div class="row editor-icons">${glyph('split')}${glyph('dots')}</div></div>
      <div class="breadcrumb">${crumb}</div>
      <div class="code-area" aria-label="示例源代码">${lines.map((line,index) => `<div class="code-line ${name === 'TaskBoard.tsx' && index === 18 ? 'highlight' : ''} ${name === 'TaskBoard.tsx' && index >= 18 && index <= 23 ? 'diff' : ''}"><span class="ln">${index + 1}</span><code>${highlight(line) || ' '}</code></div>`).join('')}
        ${jb ? '' : `<div class="minimap">${lines.map((line) => `<i style="width:${Math.min(58,line.length * .72)}px"></i>`).join('')}</div>`}
      </div><section class="term"><div class="term-head">${terminalTabs}${grow}<span>${glyph('terminal')} pwsh</span><span>${glyph('plus')}</span><span>${glyph('dots')}</span></div>
      <div class="term-copy">PS D:\\workspace\\taskboard-app&gt; git status --short\n<span class="pass"> M</span> src/features/tasks/TaskBoard.tsx\nPS D:\\workspace\\taskboard-app&gt;</div></section>`;
  }
  function reminder() {
    const toast = state.toast;
    if (!toast) return '';
    const session = getSession(toast.sessionId);
    const run = session?.turns.find((entry) => entry.id === toast.runId);
    if (run?.status !== 'waiting') return '';
    return `<aside class="toast" role="status"><div class="row">${glyph('bell')}<strong>DiCode 等待你的确认</strong>${grow}${iconButton('close','关闭提醒','','dismiss-toast')}</div>
      <p>「${esc(session.title)}」正在等待你的答复。</p><button type="button" class="primary" data-act="jump" data-value="${session.id}" data-id="${run.id}">返回对话处理 ${glyph('chevron')}</button></aside>`;
  }
  function rememberScroll() {
    const pane = document.querySelector('#panel-scroll');
    if (pane && state.page === 'chat') state.scroll.set(state.active,pane.scrollTop);
  }
  function render(options = {}) {
    if (state.composing) return;
    const previous = document.activeElement;
    const sameControl = previous?.id && ['prompt','market-query','history-query'].includes(previous.id) ? `#${previous.id}` : '';
    const button = previous?.closest('.plugin button[data-act]');
    const previousButton = button ? [
      button.closest('.history') ? '.history ' : button.closest('.panel') ? '.panel ' : '.product-rail ',
      ...['act','value','id'].filter((key) => button.dataset[key]).map((key) => `[data-${key}="${CSS.escape(button.dataset[key])}"]`),
    ].join('') : '';
    const focus = options.focus || sameControl || previousButton;
    let selection;
    try { if (sameControl && typeof previous.selectionStart === 'number') selection = [previous.selectionStart,previous.selectionEnd]; } catch { /* Search controls can omit selection APIs. */ }
    const previousPane = document.querySelector('#panel-scroll');
    const historyTop = document.querySelector('.history .history-body')?.scrollTop;
    const oldTop = options.restore ? state.scroll.get(state.active) || 0 : previousPane?.scrollTop || 0;
    const follow = previousPane && previousPane.scrollHeight > previousPane.clientHeight &&
      previousPane.scrollHeight - previousPane.clientHeight - previousPane.scrollTop < 45;
    const session = getSession();
    const max = state.layout === 'max';
    const wideHistory = max && innerWidth > 780;
    const showChat = state.page === 'chat' || (state.page === 'history' && wideHistory);
    document.body.className = `${jb ? 'jb' : 'vs'} ${state.theme}`;
    document.documentElement.style.colorScheme = state.theme;
    document.querySelector('.work').classList.toggle('max',max);
    document.querySelector('.plugin').classList.toggle('max',wideHistory);
    document.querySelector('.plugin').innerHTML = `${productRail()}${wideHistory ? historyPane() : ''}
      <section class="panel">${panelHead()}<div class="panel-scroll" id="panel-scroll">
      ${showChat ? transcript(session) : state.page === 'market' ? market() : state.page === 'notices' ? notices() : `<div class="list-page history-page"><h2>历史对话</h2>${historyContent()}</div>`}</div>
      ${showChat ? composer(session) : ''}${wideHistory ? '' : layoutFooter()}</section>`;
    const editor = document.querySelector('.workspace');
    editor.hidden = max;
    if (editor.dataset.file !== state.file) {
      editor.innerHTML = workspace();
      editor.dataset.file = state.file;
    }
    document.querySelector('#toast-anchor').innerHTML = reminder();
    const pane = document.querySelector('#panel-scroll');
    pane.scrollTop = options.bottom || (showChat && !options.restore && follow) ? pane.scrollHeight : oldTop;
    const historyBody = document.querySelector('.history .history-body');
    if (historyBody && historyTop !== undefined) historyBody.scrollTop = historyTop;
    const input = focus ? document.querySelector(focus) : null;
    if (input && !document.querySelector('dialog[open]')) {
      input.focus({preventScroll:true});
      if (selection && focus === sameControl && typeof input.setSelectionRange === 'function') input.setSelectionRange(...selection);
    }
  }

  document.body.innerHTML = `${sprite}<div class="shell">${titlebar()}
    <main class="main">${nativeRail()}<div class="work"><section class="plugin" aria-label="DiCode 插件"></section><section class="workspace" aria-label="代码工作区"></section></div>
      ${jb ? `<aside class="rightstripe" aria-label="工具窗口">${iconButton('database','Database')}${iconButton('layers','Structure')}${grow}${iconButton('terminal','Services')}</aside>` : ''}<div id="toast-anchor"></div>
    </main>${footer()}</div><dialog id="modal" aria-labelledby="modal-title"></dialog>`;
  const modal = document.querySelector('#modal');
  function openDialog(kind) {
    let body;
    if (kind === 'settings') {
      body = `<h2 id="modal-title">${glyph('settings')} 设置</h2><p>界面主题随原型内的选择切换。</p>
        <div class="row theme-row"><strong>界面主题</strong>${grow}<button type="button" class="secondary" data-act="theme" data-value="dark" aria-pressed="${state.theme === 'dark'}">暗色</button><button type="button" class="secondary" data-act="theme" data-value="light" aria-pressed="${state.theme === 'light'}">浅色</button></div>
        <div class="row theme-row"><strong>跨会话执行</strong>${grow}<span>${slots} 个工作区执行槽位</span></div>
        <div class="actions"><button type="button" class="primary" data-act="close-dialog">完成</button></div>`;
    } else if (kind === 'account') {
      body = `<h2 id="modal-title">${glyph('user')} 用户中心</h2><div class="account-row"><span class="brand">${glyph('user')}</span><div><strong>DiCode 演示用户</strong><p class="muted">当前工作区 · taskboard-app</p></div></div><p>本地原型使用示例账户。</p><div class="actions"><button type="button" class="primary" data-act="close-dialog">关闭</button></div>`;
    } else {
      body = `<h2 id="modal-title">${glyph('warn')} 开启完全访问权限？</h2>
        <p>完全访问权限允许 DiCode 自动执行组织策略许可的操作，包括删除和访问工作区外文件。</p>
        <p class="muted">仅对当前会话后续任务生效。待处理审批仍需明确答复。</p>
        <div class="actions"><button type="button" class="secondary" data-act="close-dialog" autofocus>取消</button><button type="button" class="primary danger" data-act="confirm-full" data-value="${state.active}">开启完全访问权限</button></div>`;
    }
    modal.dataset.kind = kind; modal.innerHTML = body;
    if (!modal.open) modal.showModal();
  }
  modal.addEventListener('close', () => {
    const control = modal.dataset.kind === 'permission' ? '[data-act="popover"][data-value="approval"]' : `[data-act="dialog"][data-value="${modal.dataset.kind}"]`;
    document.querySelector(control)?.focus({preventScroll:true});
  });
  function changePage(page) {
    rememberScroll();
    state.page = page;
    state.editorActive = false;
    state.popover = '';
    render({restore: page === 'chat'});
  }
  function syncPrompt(input) {
    const session = getSession();
    session.draft = input.value;
    const send = document.querySelector('#send');
    if (send) send.disabled = !input.value.trim();
    const [used,pct] = draftContext(session);
    const usage = document.querySelector('.composer-btn.usage');
    if (!usage) return;
    usage.setAttribute('aria-label',`上下文占用 ${pct}%`);
    usage.querySelector('.meter').style.setProperty('--use',`${pct}%`);
    usage.querySelector('#usage-value').textContent = `${pct}%`;
    const context = document.querySelector('#context-used');
    if (context) context.textContent = `${used}K / 128K tokens`;
  }
  document.addEventListener('click',(event) => {
    if (event.target.closest('.workspace')) state.editorActive = true;
    else if (event.target.closest('.plugin')) state.editorActive = false;
    const button = event.target.closest('button[data-act]');
    if (!button) {
      if (state.popover && !event.target.closest('.composer')) { state.popover = ''; render(); }
      return;
    }
    const { act,value,id } = button.dataset;
    const session = getSession();
    const run = latest(session);
    switch (act) {
      case 'page': changePage(value); break;
      case 'new': newSession(); break;
      case 'session': openSession(value); break;
      case 'jump': openSession(value,Number(id)); break;
      case 'layout':
        rememberScroll();
        state.layout = value;
        persist();
        render({restore:true});
        break;
      case 'notice-filter': state.noticeFilter = value; render(); break;
      case 'market-filter': state.marketFilter = value; render(); break;
      case 'install': install(value); break;
      case 'dismiss-toast': state.toast = null; render(); break;
      case 'sample': submit(samples[value].text,value); break;
      case 'answer': closeDecision(session.turns.find((item) => item.id === Number(id)),value); break;
      case 'stop':
        if (busy(run)) {
          if (state.toast?.runId === run.id) state.toast = null;
          finish(run,'stopped');
          document.querySelector('#prompt')?.focus({preventScroll:true});
        }
        break;
      case 'attach':
        session.attachment = session.attachment ? '' : state.file;
        render({focus:'#prompt'});
        break;
      case 'file':
        state.file = value;
        if (state.layout === 'max') state.layout = 'split';
        render();
        break;
      case 'popover':
        state.popover = state.popover === value ? '' : value;
        render({focus:`[data-act="popover"][data-value="${value}"]`});
        break;
      case 'model': session.model = value; state.popover = ''; render({focus:'#prompt'}); break;
      case 'effort': session.depth = value; state.popover = ''; render({focus:'#prompt'}); break;
      case 'approval':
        state.popover = '';
        if (value === 'assist') session.permission = value;
        render();
        if (value === 'full' && session.permission !== 'full') openDialog('permission');
        else document.querySelector('[data-act="popover"][data-value="approval"]')?.focus();
        break;
      case 'confirm-full':
        if (Number(value) === state.active) session.permission = 'full';
        modal.close();
        render({focus:'[data-act="popover"][data-value="approval"]'});
        break;
      case 'dialog': state.popover = ''; render(); openDialog(value); break;
      case 'close-dialog': modal.close(); break;
      case 'theme':
        state.theme = value;
        persist();
        render();
        modal.querySelectorAll('[data-act="theme"]').forEach((item) => item.setAttribute('aria-pressed',String(item.dataset.value === value)));
        break;
    }
  });
  document.addEventListener('input',(event) => {
    const input = event.target;
    if (input.id === 'prompt') syncPrompt(input);
    if (input.id === 'history-query') {
      state.historyQuery = input.value;
      document.querySelector('#session-rows').innerHTML = sessionRows();
    }
    if (input.id === 'market-query') {
      state.marketQuery = input.value;
      document.querySelector('#skill-rows').innerHTML = marketRows();
    }
  });
  document.addEventListener('compositionstart',(event) => { if (event.target.id === 'prompt') state.composing = true; });
  document.addEventListener('compositionend',(event) => { if (event.target.id === 'prompt') { state.composing = false; syncPrompt(event.target); render(); } });
  document.addEventListener('submit',(event) => {
    if (event.target.id !== 'composer') return;
    event.preventDefault();
    submit(getSession().draft);
  });
  document.addEventListener('keydown',(event) => {
    if (event.target.id === 'prompt' && event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      submit(getSession().draft);
    }
    if (event.key === 'Escape' && !modal.open && state.popover) {
      const value = state.popover;
      state.popover = '';
      render({focus:`[data-act="popover"][data-value="${value}"]`});
    }
  });
  document.addEventListener('toggle',(event) => {
    const detail = event.target;
    if (!detail.matches?.('details[data-key]') || !detail.isConnected) return;
    if (detail.open) state.expanded.add(detail.dataset.key);
    else state.expanded.delete(detail.dataset.key);
  },true);
  matchMedia('(max-width: 780px)').addEventListener('change', () => render());
  render({bottom:true});
  schedule(first);



</script>
</body>
</html>
